# Start:   docker compose up -d        Logs:  docker compose logs -f
# Update:  docker compose pull && docker compose up -d
services:
  tgtg-bot:
    image: ghcr.io/torbenstriegel/toogoodtogo-telegrambot:latest
    build: .            # used only if the image can't be pulled (or with --build)
    container_name: tgtg-telegram-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - tgtg-data:/data

volumes:
  tgtg-data:
